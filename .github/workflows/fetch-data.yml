name: Compute Global Mood Map Index

# Runs on GitHub's own servers — a completely different network/IP range
# than your home connection, which is what GDELT and Cloudflare have been
# struggling to reach reliably from. This should just work.
#
# Runs a few times a day (every 6 hours) rather than hourly — the index
# doesn't need to be that fresh, and this is gentler on GDELT/GDACS.
# Adjust the cron line below if you want a different cadence.

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC — 4x/day
  workflow_dispatch:         # lets you also trigger it manually from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated JSON file back to the repo

jobs:
  compute-index:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # hard cap — GDELT calls are now fully serialized/paced (to
                           # respect its real rate limit), so this takes longer than a
                           # fully-parallel run would; this just guards against a
                           # genuinely stuck run burning your Actions minutes forever
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run index computer
        run: python3 fetch_news_data.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mood-index-data.json
          git diff --staged --quiet || git commit -m "Update mood index data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
